name: Notify Discord on PR Creation

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send PR info to Discord
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_OPENED_PR_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          payload=$(python3 - <<'PY'
import json, os
msg = "📢 New Pull Request Created!\n**#{}**: {}\n🧑‍💻 Author: {}\n🔗 {}".format(
    os.environ['PR_NUMBER'],
    os.environ['PR_TITLE'],
    os.environ['PR_USER'],
    os.environ['PR_URL']
)
print(json.dumps({"content": msg}))
PY
)

          curl -sS --fail -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
