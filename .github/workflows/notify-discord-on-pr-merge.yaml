name: Notify Discord on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [prod]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send notification to Discord
        if: ${{ secrets.DISCORD_MERGED_WEBHOOK_URL != '' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_MERGED_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Build JSON safely (handles escaping)
          payload=$(python3 - <<'PY'
import json, os
msg = "✅ **PR #{}**: {} was merged into `prod` by **{}**\n🔗 {}".format(
    os.environ['PR_NUMBER'],
    os.environ['PR_TITLE'],
    os.environ['PR_USER'],
    os.environ['PR_URL']
)
print(json.dumps({"content": msg}))
PY
)

          # send to discord without printing the webhook
          curl -sS --fail -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
          